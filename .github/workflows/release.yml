name: Build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          assert.match(tag, /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(tag, `v${pkg.version}`, 'Tag must match package.json version');
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          JS
      - run: npm ci
      - name: Test data downloader
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Build and run unit and DOM integration tests
        run: npm test
      - name: Verify committed userscript matches the build
        run: git diff --exit-code -- dist/iig-uops-bridge.user.js
      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium firefox
      - name: Run browser tests
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          npx playwright test
      - name: Generate checksum
        working-directory: dist
        run: sha256sum iig-uops-bridge.user.js > iig-uops-bridge.user.js.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" = false ]; then
              echo "Release $RELEASE_TAG is already published; keeping its assets unchanged."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" dist/iig-uops-bridge.user.js dist/iig-uops-bridge.user.js.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/iig-uops-bridge.user.js dist/iig-uops-bridge.user.js.sha256 \
              --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-browser-failures-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
